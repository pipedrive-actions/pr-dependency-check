name: 'PR Dependency Check'
description: 'Verify PR dependencies are merged or closed'
branding:
  icon: alert-triangle
  color: orange
runs:
  using: 'node20'
  main: 'index.js'
inputs:
  custom-domains:
    description: 'Space-delimited list of custom domains where issues may be found'
    required: false
    default: null
  pr-number:
    description: 'PR number to check'
    required: false
    default: ''
  max-retries:
    description: 'Maximum number of retry attempts for GitHub API calls on transient 5xx/429 errors (default: 5)'
    required: false
    default: '5'
